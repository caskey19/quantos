[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quantos"
version = "0.1.0"
description = "Private single-user quantitative research and execution system. Live trading is disabled by default."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
  "sqlalchemy>=2.0.36",
  "pandas>=2.2",
  "numpy>=2.0",
  "pyarrow>=17",
  "duckdb>=1.1",
  "pyyaml>=6.0",
  "psutil>=6.0",
  "scipy>=1.14",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
broker = ["alpaca-py>=0.33"]
dev = ["pytest>=8.3", "httpx>=0.27"]

[project.scripts]
quantos-api = "quantos.api.http:main"
quantos-study = "quantos.research.study:main"

[tool.setuptools.packages.find]
where = ["packages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages"]
addopts = "-q"

[tool.setuptools.package-data]
quantos = ["py.typed"]
